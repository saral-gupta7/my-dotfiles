[[manager.prepend_keymap]]
on = "z"
run = "plugin zoxide"

[[manager.prepend_keymap]]
on = "Z"
run = "plugin fzf"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "F"
run  = 'shell -- if [ $# -eq 0 ]; then open .; else for p in "$@"; do if [ -d "$p" ]; then open "$p"; else open .; fi; done; fi'
desc = "Open in Finder"
for  = "macos"

