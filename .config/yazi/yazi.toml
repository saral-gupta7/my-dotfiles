enable = true

[preview]
max_width = 1920
max_height = 1440

[manager]
sort_by = "extension"
sort_reverse = false
sort_sensitive = false

[mgr]
show_hidden = false
linemode = "size"

# [[plugin.prepend_previewers]]
# mime = "video/*"
# run = "video-timeline"

[opener]
play = [
  { run = 'open -a mpv "$@"', desc = "Play with mpv", orphan = true, for = "macos" }
]

edit = [
  { run = 'nvim "$@"', desc = "Edit with Neovim", block = true }
]

image = [
  { run = 'open "$@"', desc = "Open Image (Preview)", orphan = true, for = "macos" }
]

pdf = [
  { run = 'open "$@"', desc = "Open PDF (Preview)", orphan = true, for = "macos" }
]

affinity = [
  { run = 'open "$@"', desc = "Open with Affinity", orphan = true, for = "macos" }
]

markdown = [
  { run = 'nvim "$@"', desc = "Edit Markdown with Neovim", block = true }
]

[open]
rules = [
  # Empty / special
  { mime = "inode/empty", use = "edit" },

  # Media
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },

  # PDF
  { mime = "application/pdf", use = "pdf" },

  # JSON and structured text
  { mime = "application/json", use = "edit" },
  { name = "*.json",  use = "edit" },
  { name = "*.toml",  use = "edit" },
  { name = "*.yaml",  use = "edit" },
  { name = "*.yml",   use = "edit" },
  { name = "*.xml",   use = "edit" },
  { name = "*.ini",   use = "edit" },
  { name = "*.conf",  use = "edit" },
  { name = "*.env",   use = "edit" },

  # Source code
  { name = "*.go",    use = "edit" },
  { name = "*.lua",   use = "edit" },
  { name = "*.rs",    use = "edit" },
  { name = "*.py",    use = "edit" },
  { name = "*.js",    use = "edit" },
  { name = "*.ts",    use = "edit" },
  { name = "*.jsx",   use = "edit" },
  { name = "*.tsx",   use = "edit" },
  { name = "*.java",  use = "edit" },
  { name = "*.c",     use = "edit" },
  { name = "*.cpp",   use = "edit" },
  { name = "*.h",     use = "edit" },
  { name = "*.sh",    use = "edit" },
  { name = "*.zsh",   use = "edit" },
  { name = "*.bash",  use = "edit" },

  # Markdown
  { name = "*.md",    use = "edit" },

  # Affinity
  { name = "*.afdesign", use = "affinity" },
  { name = "*.afphoto",  use = "affinity" },
  { name = "*.afpub",    use = "affinity" },

  # Generic text
  { mime = "text/*", use = "edit" },

  # Absolute fallback (MUST be last)
  { name = "*", use = "edit" },
]
