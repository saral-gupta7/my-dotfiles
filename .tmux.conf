set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# new config
set -g detach-on-destroy off
set -g renumber-windows on
set -g focus-events on
set -g history-limit 100000
set -g status-interval 5
# set -g set-clipboard on
set -g base-index 1
set -g allow-passthrough all
set -gq allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind o split-window -h -c "#{pane_current_path}"

unbind '"'
bind i split-window -v -c "#{pane_current_path}"

tmux_sessionizer="~/scripts/tmux-sessionizer"
# Keybind for opening dot files
# unbind C-b
# bind-key -r C-b run-shell "$tmux_sessionizer ~/dotfiles/"
#
# # Keybind for scripts folder
# unbind C-x
# bind-key -r C-x run-shell "$tmux_sessionizer ~/vps/"
#
# # Keybind for karabiner folder
# unbind C-y
# bind-key -r C-y run-shell "$tmux_sessionizer ~/.config/nix-darwin/"
# unbind C-x
# bind-key -r C-x run-shell "$tmux_sessionizer ~/recreation/"

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Reload zshrc in all panes
bind R run-shell 'tmux list-panes -a -F "#{pane_id}" | xargs -I {} tmux send-keys -t {} "source ~/.zshrc" C-m'

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

set-option -g status-position top

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# https://github.com/3rd/image.nvim/?tab=readme-ov-file#tmux
# This is needed by the image.nvim plugin
set -gq allow-passthrough on
# This is related to the `tmux_show_only_in_active_window = true,` config in
# image.nvim
set -g visual-activity off

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 0

set -g @plugin 'christoomey/vim-tmux-navigator'

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'omerxx/tmux-floax'

# sessionx configuration
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'Space'
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-window-height '50%'
set -g @sessionx-window-width '40%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-prefix on
# set -g @sessionx-bind 'v'

# list of tmux plugins
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
# set -g @plugin 'fabioluciano/tmux-tokyo-night'

# Alternate session
unbind Space
unbind O
unbind v
# bind-key Space switch-client -l

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Rosé Pine theme
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'

# Balanced status line: session | windows | battery, time, directory.
set -g @rose_pine_user 'off'
set -g @rose_pine_host 'off'
set -g @rose_pine_date_time ''
set -g @rose_pine_directory 'on'
set -g @rose_pine_status_right_prepend_section '#[fg=#c4a7e7]󰁹 #(pmset -g batt | grep -Eo "[0-9]+%" | head -1)#[fg=#908caa] '

# Use Rosé Pine's solid base and avoid duplicate active-window labels.
set -g @rose_pine_bar_bg_disable 'off'
set -g @rose_pine_only_windows 'off'
set -g @rose_pine_disable_active_window_menu 'on'

# Compact window labels that follow the active program.
set -g @rose_pine_default_window_behavior 'off'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'off'
set -g @rose_pine_left_separator '  '
set -g @rose_pine_right_separator '  '
set -g @rose_pine_field_separator '  '
set -g @rose_pine_window_status_separator '  '

# Nerd Font icons.
set -g @rose_pine_session_icon '' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '' # Changes the default icon to the left of the active window name
set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon '' # Changes the default icon to the right of the hostname
set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname
set -g @rose_pine_date_time_icon '󰃰' # Changes the default icon to the right of the date module

# Give windows priority when space gets tight.
set -g @rose_pine_prioritize_windows 'on'
set -g @rose_pine_width_to_hide '110'
set -g @rose_pine_window_count '7'

run '~/.tmux/plugins/tpm/tpm'
